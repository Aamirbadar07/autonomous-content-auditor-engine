[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-content-auditor-engine"
version = "1.0.0"
authors = [
  { name="Principal AI Architecture Team" }
]
description = "Enterprise Autonomous Content Auditor & Fact-Checking Engine with Google ADK, Gemini 3.5 Flash, and Google Search Grounding"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-adk>=2.10.0",
    "pydantic>=2.10.0",
]

[tool.setuptools.packages.find]
# Without this, flat-layout auto-discovery fails on the samples/ and tests/
# directories and `pip install -e .` errors out.
include = ["geo_validator*", "llm_auditor*", "my_google_search_agent*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
